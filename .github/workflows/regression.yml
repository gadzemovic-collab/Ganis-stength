name: Regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: |
          for file in *.js; do node --check "$file" || exit; done
          sed -n '/^<script>$/,/^<\/script>$/p' index.html | sed '1d;$d' | node --check
          node --test tests/regression.cjs
