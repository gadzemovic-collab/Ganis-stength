<script>

const BASE_MENU={

Quads:[
"Leg Press",
"Leg Extension"
],

Hamstrings:[
"Seated Leg Curl",
"Deadlift",
"Standing Leg Curl"
],

Chest:[
"DB Bench Press",
"Incline Chest Press",
"Pec Deck"
],

Back:[
"Lat Pulldown",
"Chest-Supported Row",
"Machine High Row"
],

Shoulders:[
"Lateral Raise",
"DB Shoulder Press"
],

RearDelts:[
"Reverse Pec Deck"
],

Biceps:[
"DB Curl",
"Hammer Curl",
"Preacher Curl"
],

Triceps:[
"Triceps Pushdown",
"Triceps Dip Machine"
],

Calves:[
"Calf Raise"
],

Core:[
"Cable Crunch"
]

};

const startWeights={
"Leg Press":180,
"DB Bench Press":45,
"Lateral Raise":15,
"DB Curl":35
};

let db=
JSON.parse(
localStorage.getItem("ganiStrengthV2")
||
'{"selected":[],"sessions":[],"history":{},"customExercises":{},"deletedExercises":{},"draftWorkout":null}'
);

if(!db.customExercises) db.customExercises={};
if(!db.deletedExercises) db.deletedExercises={};
if(!db.selected) db.selected=[];
if(!db.sessions) db.sessions=[];
if(!db.history) db.history={};
if(!("draftWorkout" in db)) db.draftWorkout=null;

function saveDB(){
localStorage.setItem(
"ganiStrengthV2",
JSON.stringify(db)
);
}

function buildMenu(){

const menu={};

Object.entries(BASE_MENU).forEach(([group,base])=>{

const deleted=
db.deletedExercises[group]||[];

const custom=
db.customExercises[group]||[];

menu[group]=[
...base.filter(ex=>!deleted.includes(ex)),
...custom.filter(ex=>!deleted.includes(ex))
];

menu[group]=[
...new Set(menu[group])
];

});

return menu;

}

let MENU=buildMenu();

if(!db.selected.length){

db.selected=[
"Leg Press",
"Seated Leg Curl",
"DB Bench Press",
"Lat Pulldown",
"Lateral Raise",
"DB Curl",
"Triceps Pushdown"
];

}

db.selected=
db.selected.filter(
ex=>
Object.values(MENU)
.flat()
.includes(ex)
);

function refreshMenu(){
MENU=buildMenu();
}

function groupLabel(g){
return g==="RearDelts"
? "Rear Delts"
: g;
}

function target(ex){

return /curl|raise|pushdown|dip|pec deck|crunch|extension/i.test(ex)
? "8–10"
: "6–8";

}

function lastSessionForExercise(ex){

for(
let i=db.sessions.length-1;
i>=0;
i--
){

const session=
db.sessions[i];

const found=
session.exercises?.find(
item=>item.name===ex
);

if(found){

return{
date:session.date,
sets:found.sets||[]
};

}

}

return null;

}

function selectedForGroup(group){

const options=
MENU[group]||[];

return db.selected.find(
x=>options.includes(x)
) || "";

}

function ensureDraft(){

if(!db.draftWorkout){

db.draftWorkout={
startedAt:new Date().toISOString(),
exercises:{}
};

saveDB();

}

}

function getDraftExercise(ex){

ensureDraft();

if(!db.draftWorkout.exercises[ex]){

const previous=
lastSessionForExercise(ex);

const sets=[0,1,2].map(j=>{

const prior=
previous?.sets?.[j];

return{
weight:
prior?.weight ??
(j===0 ? (startWeights[ex]||"") : ""),
reps:
prior?.reps ?? "",
prefilled:!!prior,
confirmed:false
};

});

db.draftWorkout.exercises[ex]={
sets
};

saveDB();

}

return db.draftWorkout.exercises[ex];

}

function saveDraftField(
ex,
setIndex,
field,
value
){

const draft=
getDraftExercise(ex);

draft.sets[setIndex][field]=value;

draft.sets[setIndex].prefilled=false;

draft.sets[setIndex].confirmed=false;

saveDB();

updateSetVisual(
ex,
setIndex
);

}

function confirmDraftSet(
ex,
setIndex
){

const draft=
getDraftExercise(ex);

const s=
draft.sets[setIndex];

if(!s.weight || !s.reps){

toast(
"Enter weight and reps first"
);

return;

}

s.prefilled=false;
s.confirmed=true;

saveDB();

updateSetVisual(
ex,
setIndex
);

toast(
"Set completed"
);

startTimer(90);

}

function updateSetVisual(
ex,
setIndex
){

const row=
document.querySelector(
`[data-set-row="${CSS.escape(ex)}-${setIndex}"]`
);

if(!row) return;

const draft=
getDraftExercise(ex);

const s=
draft.sets[setIndex];

row.classList.remove(
"prefilled",
"edited",
"completed"
);

if(s.confirmed){

row.classList.add(
"completed"
);

}
else if(s.prefilled){

row.classList.add(
"prefilled"
);

}
else{

row.classList.add(
"edited"
);

}

}

function chooseOrAdd(
group,
value
){

if(value==="__add__"){

addCustomExercise(group);
return;

}

chooseForGroup(
group,
value
);

}

function addCustomExercise(group){

const name=
prompt(
"Enter new " +
groupLabel(group) +
" exercise name:"
);

if(!name){

renderWorkout();
return;

}

const clean=
name.trim();

if(!clean){

renderWorkout();
return;

}

const baseMatch=
(BASE_MENU[group]||[])
.find(
x=>
x.toLowerCase()===
clean.toLowerCase()
);

if(baseMatch){

db.deletedExercises[group]??=[];

db.deletedExercises[group]=
db.deletedExercises[group]
.filter(
x=>x!==baseMatch
);

saveDB();

refreshMenu();

chooseForGroup(
group,
baseMatch
);

toast(
baseMatch+" restored"
);

return;

}

const existing=
(MENU[group]||[])
.find(
x=>
x.toLowerCase()===
clean.toLowerCase()
);

if(existing){

chooseForGroup(
group,
existing
);

toast(
"That exercise already exists"
);

return;

}

db.customExercises[group]??=[];

db.customExercises[group].push(
clean
);

db.deletedExercises[group]??=[];

db.deletedExercises[group]=
db.deletedExercises[group]
.filter(
x=>
x.toLowerCase()!==
clean.toLowerCase()
);

saveDB();

refreshMenu();

chooseForGroup(
group,
clean
);

toast(
clean+" added"
);

}

function deleteCurrentExercise(group){

const ex=
selectedForGroup(group);

if(!ex){

toast(
"Choose an exercise first"
);

return;

}

if(
!confirm(
`Delete "${ex}" from your ${groupLabel(group)} choices?

Workout history for ${ex} will NOT be deleted.`
)
){

return;

}

db.selected=
db.selected.filter(
x=>x!==ex
);

const isBuiltIn=
(BASE_MENU[group]||[])
.includes(ex);

if(isBuiltIn){

db.deletedExercises[group]??=[];

if(
!db.deletedExercises[group]
.includes(ex)
){

db.deletedExercises[group]
.push(ex);

}

}
else{

db.customExercises[group]??=[];

db.customExercises[group]=
db.customExercises[group]
.filter(
x=>x!==ex
);

}

saveDB();

refreshMenu();

renderWorkout();

toast(
ex+" removed"
);

}

function chooseForGroup(
group,
ex
){

const groupExercises=
MENU[group]||[];

const existing=
db.selected.find(
x=>groupExercises.includes(x)
);

if(existing){

db.selected=
db.selected.filter(
x=>x!==existing
);

}

if(ex){

if(
db.selected.length>=8
){

if(existing){
db.selected.push(existing);
}

renderWorkout();

return toast(
"Maximum 8 exercises"
);

}

db.selected.push(ex);

getDraftExercise(ex);

}

saveDB();

renderWorkout();

}

function renderWorkout(){

refreshMenu();

let el=
document.getElementById("workout");

el.innerHTML="";

Object.entries(MENU).forEach(
([group,arr])=>{

const current=
selectedForGroup(group);

const card=
document.createElement("div");

card.className=
"workout-part";

const options=`

<option value="">
— None —
</option>

${arr.map(
ex=>
`<option
value="${ex}"
${ex===current?"selected":""}
>
${ex}
</option>`
).join("")}

<option value="__add__">
＋ Add Custom Exercise…
</option>

`;

let logger="";

if(current){

const previous=
lastSessionForExercise(current);

const draft=
getDraftExercise(current);

let previousBox="";

if(previous){

const date=
new Date(previous.date)
.toLocaleDateString(
undefined,
{
month:"short",
day:"numeric",
year:"numeric"
}
);

previousBox=`

<div class="last-workout">

<div class="last-title">
Last workout (${date})
</div>

${previous.sets.map(
(s,index)=>
`<div class="last-set">
Set ${index+1}: ${s.weight} × ${s.reps}
</div>`
).join("")}

</div>

<div class="prefill-note">
Pre-filled from last workout — update as you go
</div>

`;

}

logger=`

<div class="exercise-actions">

<button
class="danger small"
onclick="deleteCurrentExercise('${group}')"
>
Delete ${current}
</button>

</div>

${previousBox}

<div class="exercise-logger">

<div class="sets">

${[0,1,2].map(
j=>{

const s=
draft.sets[j];

let rowClass=
s.confirmed
? "completed"
: s.prefilled
? "prefilled"
: "edited";

return`

<div
class="set ${rowClass}"
data-set-row="${current}-${j}"
>

<div class="setnum">
${j+1}
</div>

<div>

<label>
Weight
</label>

<input
inputmode="decimal"
value="${s.weight}"
oninput="saveDraftField('${current}',${j},'weight',this.value)"
>

</div>

<div>

<label>
Reps
</label>

<input
inputmode="numeric"
value="${s.reps}"
placeholder="${target(current).replace("–","-")}"
oninput="saveDraftField('${current}',${j},'reps',this.value)"
>

</div>

<button
class="secondary check"
onclick="confirmDraftSet('${current}',${j})"
>
✓
</button>

</div>

`;

}
).join("")}

</div>

${

current==="Deadlift"

?

`<div class="muted">
Keep 1–2 reps in reserve.
Do not take deadlifts to failure.
</div>`

:

""

}

</div>

`;

}

card.innerHTML=`

<div class="row between">

<h3>
${groupLabel(group)}
</h3>

<span class="tag">

${

current

? `Target ${target(current)}`
: "Optional"

}

</span>

</div>

<select
onchange="
chooseOrAdd(
'${group}',
this.value
)
"
>

${options}

</select>

${logger}

`;

el.appendChild(card);

}
);

}

function newWorkout(){

if(
db.draftWorkout &&
Object.keys(
db.draftWorkout.exercises||{}
).length
){

if(
!confirm(
"Start a new workout? This will discard your current unfinished workout."
)
){

return;

}

}

db.draftWorkout={
startedAt:new Date().toISOString(),
exercises:{}
};

saveDB();

renderWorkout();

toast(
"New workout started"
);

}

function saveWorkout(){

if(!db.draftWorkout){

toast(
"No workout in progress"
);

return;

}

let session={
date:new Date().toISOString(),
exercises:[]
};

for(
const [ex,data]
of Object.entries(
db.draftWorkout.exercises
)
){

const sets=
(data.sets||[])
.filter(
s=>
s.confirmed &&
s.weight &&
s.reps
)
.map(
s=>({
weight:+s.weight,
reps:+s.reps
})
);

if(!sets.length){
continue;
}

session.exercises.push({
name:ex,
sets
});

const best=
sets.reduce(
(a,b)=>
b.weight>a.weight
? b
: a
);

db.history[ex]??=[];

db.history[ex].push({
weight:best.weight,
reps:best.reps,
date:session.date
});

}

if(
!session.exercises.length
){

toast(
"Complete at least one set first"
);

return;

}

db.sessions.push(
session
);

db.draftWorkout=null;

saveDB();

renderHistory();

populateChartExercises();

renderWorkout();

toast(
"Workout saved"
);

}

function renderHistory(){

document.getElementById(
"wcount"
).textContent=
db.sessions.length;

document.getElementById(
"ecount"
).textContent=
db.sessions.reduce(
(a,s)=>
a+s.exercises.length,
0
);

let el=
document.getElementById(
"historyList"
);

el.innerHTML="";

let entries=
Object.entries(
db.history
)
.filter(
([_,a])=>a.length
)
.reverse();

if(!entries.length){

el.innerHTML=
"<div class='muted'>No exercise history yet.</div>";

return;

}

entries.forEach(
([ex,a])=>{

let x=
a[a.length-1];

let d=
new Date(
x.date
).toLocaleDateString();

let div=
document.createElement(
"div"
);

div.className=
"history-item";

div.innerHTML=

`<span>

<b>
${ex}
</b>

<br>

<small>
${d}
</small>

</span>

<b>
${x.weight} × ${x.reps}
</b>`;

el.appendChild(
div
);

}
);

}

function clearHistory(){

if(
confirm(
"Delete all workout history, exercise selections, custom exercises and your current draft workout?"
)
){

localStorage.removeItem(
"ganiStrengthV2"
);

location.reload();

}

}

function show(
id,
btn
){

document.querySelectorAll(
".screen"
).forEach(
x=>
x.classList.remove(
"active"
)
);

document.getElementById(
id
).classList.add(
"active"
);

document.querySelectorAll(
"nav button"
).forEach(
x=>
x.classList.remove(
"active"
)
);

btn.classList.add(
"active"
);

if(id==="train"){
renderWorkout();
}

if(id==="history"){
renderHistory();
}

if(id==="charts"){
populateChartExercises();
renderCharts();
}

}

let timer=null;
let remaining=0;

function startTimer(sec){

clearInterval(timer);

remaining=sec;

toast(
"Rest timer started"
);

timer=
setInterval(
()=>{

remaining--;

if(
remaining<=0
){

clearInterval(timer);

toast(
"Rest complete"
);

}
else if(
remaining%30===0
){

toast(
remaining+
" sec remaining"
);

}

},
1000
);

}

function toast(t){

let x=
document.getElementById(
"toast"
);

x.textContent=t;

x.style.display=
"block";

clearTimeout(
x._t
);

x._t=
setTimeout(
()=>{

x.style.display=
"none";

},
1800
);

}

function populateChartExercises(){

const sel=
document.getElementById(
"chartExercise"
);

const names=
Object.keys(
db.history
)
.filter(
k=>db.history[k]?.length
);

const current=
sel.value;

sel.innerHTML=

names.length

?

names.map(
n=>
`<option value="${n}">
${n}
</option>`
).join("")

:

`<option>
No logged exercises yet
</option>`;

if(
names.includes(current)
){

sel.value=current;

}

}

function svgLineChart(
containerId,
points,
valueFn,
valueLabel
){

const el=
document.getElementById(
containerId
);

if(!points.length){

el.innerHTML=
"<div class='muted'>Log workouts to see this chart.</div>";

return;

}

const W=640;
const H=220;
const pL=48;
const pR=18;
const pT=20;
const pB=35;

const vals=
points.map(valueFn);

const min=
Math.min(...vals);

const max=
Math.max(...vals);

const lo=
min===max
? Math.max(0,min-1)
: min;

const hi=
min===max
? max+1
: max;

const x=i=>
pL+
(
points.length===1
? (W-pL-pR)/2
: i*
(W-pL-pR)/
(points.length-1)
);

const y=v=>
pT+
(hi-v)*
(H-pT-pB)/
(hi-lo||1);

let grid="";

for(
let i=0;
i<5;
i++
){

let yy=
pT+
i*
(H-pT-pB)/4;

grid+=
`<line
class="chart-grid"
x1="${pL}"
y1="${yy}"
x2="${W-pR}"
y2="${yy}"
/>`;

}

let poly=
points.map(
(p,i)=>
`${x(i)},${y(valueFn(p))}`
).join(" ");

let dots=
points.map(
(p,i)=>
`<circle
class="chart-dot"
cx="${x(i)}"
cy="${y(valueFn(p))}"
r="4"
>

<title>
${new Date(
p.date
).toLocaleDateString()}:
${valueFn(p).toFixed(1)}
${valueLabel}
</title>

</circle>`
).join("");

let first=
new Date(
points[0].date
).toLocaleDateString();

let lastd=
new Date(
points[
points.length-1
].date
).toLocaleDateString();

el.innerHTML=

`<svg
viewBox="0 0 ${W} ${H}"
preserveAspectRatio="none"
>

${grid}

<polyline
class="chart-line"
points="${poly}"
/>

${dots}

<text
class="chart-label"
x="${pL}"
y="${H-8}"
>
${first}
</text>

<text
class="chart-label"
text-anchor="end"
x="${W-pR}"
y="${H-8}"
>
${lastd}
</text>

<text
class="chart-label"
x="5"
y="${pT+5}"
>
${hi.toFixed(0)}
</text>

<text
class="chart-label"
x="5"
y="${H-pB}"
>
${lo.toFixed(0)}
</text>

</svg>`;

}

function renderCharts(){

const name=
document.getElementById(
"chartExercise"
)?.value;

const pts=
(
name &&
db.history[name]
)
? db.history[name]
: [];

svgLineChart(
"weightChart",
pts,
p=>+p.weight,
"lb"
);

svgLineChart(
"e1rmChart",
pts,
p=>
+p.weight*
(
1+
(+p.reps/30)
),
"lb"
);

const sessions=
db.sessions.map(
s=>({
date:s.date,
volume:
s.exercises.reduce(
(sum,e)=>
sum+
e.sets.reduce(
(a,z)=>
a+
(
+z.weight*
+z.reps
),
0
),
0
)
})
);

svgLineChart(
"volumeChart",
sessions,
p=>p.volume,
"lb-reps"
);

}

ensureDraft();

renderWorkout();

renderHistory();

if(
"serviceWorker"
in navigator
){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker.register(
"./sw.js"
);

}
);

}

</script>
